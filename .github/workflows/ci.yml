name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a change to the deployed API is noticed even when nothing here
  # changes. Only the contract job runs on the schedule.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job names its runner image. ubuntu-latest moves to a new image on
  # GitHub's schedule, so a change of operating system arrives as a pull
  # request here rather than as a red run nobody caused.
  build-and-test:
    name: build-and-test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node, pnpm, the cached store and the install: .github/actions/setup.
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      # Hand-wrapped documents under docs/ are excluded in .prettierignore
      # (build plan decision 18); everything else is held to Prettier here.
      - run: pnpm format:check
      # High and critical advisories fail the build, development tools included.
      - run: pnpm audit --audit-level high
      # The unit suite, held to the coverage floor in vite.config.ts.
      - run: pnpm coverage
      - run: pnpm build
      # The production JavaScript, gzipped, against the budget in scripts/bundle-budget.mjs.
      - run: pnpm budget

      # The production bundle carries neither the mock nor the specimen route
      # (build plan Gate 2, ADR 0005). The e2e job builds a second bundle that
      # does carry the mock (ADR 0012), so this is asserted on every run rather
      # than by hand: each string below exists only in code that must be gone.
      - name: Production bundle carries no mock and no specimen
        run: |
          if grep -rlF -e '[MSW]' -e 'Design specimen' -e 'mock-admin-password' -e '__umapiMock' dist/assets; then
            echo "::error::The production bundle contains the mock or the specimen route."
            exit 1
          fi
          echo "dist/assets is free of the mock and the specimen route."

  e2e:
    name: e2e
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # A hung step fails the job instead of holding the check for hours:
    # a Playwright worker once failed to exit and the job ran 44 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node, pnpm, the cached store and the install: .github/actions/setup.
      - uses: ./.github/actions/setup

      # Chromium runs every spec; Firefox and WebKit the smoke and accessibility
      # specs (playwright.config.ts).
      # The runner's Azure apt mirror has gone unreachable and left apt waiting
      # until the job timed out. Use the main Ubuntu archive, and give apt short
      # timeouts and retries, before Playwright installs its system packages.
      - name: Point apt at a reachable mirror
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts > /dev/null

      - name: Install the browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # The Playwright web server builds the bundle and serves it over
      # vite preview, so this step needs no separate build.
      - run: pnpm test:e2e

      # A failed spec keeps its trace (taken on the retry) and screenshots.
      - name: Upload the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # Regenerates src/lib/api/schema.d.ts from the deployed document and fails if
  # it differs from what is committed. Deliberately not a required check: the
  # document lives on a free instance that sleeps and can be down, and a merge
  # must not wait on it. See docs/adr/0006-generated-api-types.md.
  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_ORIGIN: https://api.aleksadragnic.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node, pnpm, the cached store and the install: .github/actions/setup.
      - uses: ./.github/actions/setup

      # An idle instance takes about half a minute to answer
      # (docs/OBSERVED-BEHAVIOUR.md row 35). Twelve attempts, then give up and say so.
      - name: Wake the API
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 30 "$API_ORIGIN/health/ready" > /dev/null; then
              echo "API ready on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The API did not become ready, so the contract was not checked."
          exit 1

      - run: pnpm api:generate

      - name: Compare with the committed schema
        run: |
          if ! git diff --exit-code -- src/lib/api/schema.d.ts; then
            echo "::error::The deployed API's document no longer matches src/lib/api/schema.d.ts. Run pnpm api:generate and review the diff."
            exit 1
          fi
