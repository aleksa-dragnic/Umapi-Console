name: Headers

# What Cloudflare Pages serves, compared with public/_headers (ADR 0015). Weekly
# and by hand, never on a pull request: it reads the deployed site, which a
# pull request has not changed yet.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    name: headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/compare-headers.mjs
