# Weekly, grouped, and no version younger than a week: the same caution as
# pnpm's release-age policy (pnpm-workspace.yaml), applied to what Dependabot
# proposes. Minor and patch updates come grouped; a major version comes in a
# pull request of its own, because it is a decision rather than an update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The types follow the Node line the console runs on (.nvmrc), not the
      # newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # CodeQL's init and analyze actions are one release and must move
    # together, majors included, or each pull request runs a different version
    # of the two. Every other action is grouped for minor and patch, the same
    # rule as npm above; a major comes on its own.
    groups:
      codeql:
        patterns: ['github/codeql-action*']
      actions:
        update-types: [minor, patch]
        patterns: ['*']
        exclude-patterns: ['github/codeql-action*']
